services:
  - type: web
    name: tigtagtoe-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Set to an Ollama server reachable from this backend over a private network.
      # localhost would refer to the Render container, not your laptop.
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: qwen3:4b
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "120"
      # SQLite lives inside the container on the free tier. It is ephemeral:
      # when Render restarts the service (idle timeout, redeploy, etc) the
      # database resets. Reviewers just re-upload the sample CSV. Swap to
      # Postgres by changing this value to a postgresql+psycopg URL.
      - key: DATABASE_URL
        value: sqlite:///./tigtagtoe.db
      - key: CORS_ORIGINS
        sync: false
      - key: AGENT_CONCURRENCY
        value: "1"
      - key: MAX_EMAILS_PER_RUN
        value: "300"
      - key: MAX_BODY_CHARS
        value: "4000"
